<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f3" />
    <title>Porac Pricing DSS</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      const crops = ['All crops', 'Rice', 'Corn', 'Eggplant', 'Bitter melon', 'Cassava', 'Banana'];
      const districts = ['All communities', 'Porac Poblacion', 'Cangatba', 'Pulung Santol', 'Salu'];
      const cropTrend = { Rice: [47, 48, 49, 48, 50, 51, 52, 51], Corn: [31, 32, 31, 33, 34, 35, 34, 36], Eggplant: [58, 55, 61, 64, 62, 67, 65, 69], 'Bitter melon': [72, 74, 71, 76, 79, 77, 81, 83], Cassava: [22, 23, 24, 23, 25, 26, 26, 27], Banana: [39, 40, 42, 41, 43, 45, 44, 46] };
      const months = ['Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];
      const weatherForecast = [
        { day: 'Today', icon: '☀', temp: '31°', note: 'Warm and clear' },
        { day: 'Wed', icon: '☁', temp: '30°', note: 'Cloudy intervals' },
        { day: 'Thu', icon: '☂', temp: '29°', note: 'Scattered rain' },
        { day: 'Fri', icon: '☂', temp: '30°', note: 'Afternoon showers' },
        { day: 'Sat', icon: '☀', temp: '32°', note: 'Mostly sunny' },
      ];
      const state = { tab: window.location.hash.replace('#', '') || 'overview', crop: 'All crops', district: 'All communities', period: 'Last 8 months', priceSlide: 0, communitySlide: 0, showAllTransactions: false, markets: [
        { id: 1, name: 'Porac Farmers Trading Post', community: 'Porac Poblacion', crops: ['Rice', 'Corn', 'Eggplant'], contact: 'Poblacion public market', active: true },
        { id: 2, name: 'Cangatba Agri Center', community: 'Cangatba', crops: ['Rice', 'Corn', 'Cassava', 'Banana'], contact: 'Cangatba roadside center', active: true },
        { id: 3, name: 'Pulung Santol Crop Stall', community: 'Pulung Santol', crops: ['Rice', 'Bitter melon', 'Eggplant'], contact: 'Pulung Santol collection point', active: true },
        { id: 4, name: 'Salu Growers Cooperative', community: 'Salu', crops: ['Corn', 'Cassava', 'Banana'], contact: 'Salu growers shed', active: true },
      ], prices: [
        { marketId: 1, crop: 'Rice', price: 51, change: 2.0, volume: '1,240 kg' }, { marketId: 1, crop: 'Corn', price: 35, change: 4.5, volume: '840 kg' }, { marketId: 1, crop: 'Eggplant', price: 67, change: -1.5, volume: '210 kg' },
        { marketId: 2, crop: 'Rice', price: 49, change: 1.2, volume: '980 kg' }, { marketId: 2, crop: 'Corn', price: 36, change: 5.8, volume: '720 kg' }, { marketId: 2, crop: 'Cassava', price: 27, change: 3.0, volume: '560 kg' }, { marketId: 2, crop: 'Banana', price: 46, change: 2.2, volume: '380 kg' },
        { marketId: 3, crop: 'Rice', price: 52, change: 3.4, volume: '760 kg' }, { marketId: 3, crop: 'Bitter melon', price: 83, change: 6.1, volume: '180 kg' }, { marketId: 3, crop: 'Eggplant', price: 69, change: 2.8, volume: '230 kg' },
        { marketId: 4, crop: 'Corn', price: 34, change: 1.8, volume: '650 kg' }, { marketId: 4, crop: 'Cassava', price: 26, change: 0.9, volume: '490 kg' }, { marketId: 4, crop: 'Banana', price: 45, change: -2.0, volume: '310 kg' },
      ], transactions: [
        { date: '18 Sep 2026', crop: 'Rice', marketId: 1, quantity: '420 kg', price: 51, status: 'Settled' }, { date: '17 Sep 2026', crop: 'Corn', marketId: 2, quantity: '280 kg', price: 36, status: 'Settled' }, { date: '16 Sep 2026', crop: 'Bitter melon', marketId: 3, quantity: '90 kg', price: 83, status: 'Settled' }, { date: '15 Sep 2026', crop: 'Cassava', marketId: 4, quantity: '210 kg', price: 26, status: 'Settled' }, { date: '13 Sep 2026', crop: 'Eggplant', marketId: 1, quantity: '75 kg', price: 67, status: 'Recorded' }, { date: '11 Sep 2026', crop: 'Banana', marketId: 2, quantity: '120 kg', price: 46, status: 'Settled' },
      ], calculator: { crop: 'Rice', area: 1.5, harvest: 6300, production: 42000, transportation: 6500, margin: 18, loss: 5 }, toast: '' };
      const cropYieldPerHectare = { Rice: 4200, Corn: 3600, Eggplant: 8500, 'Bitter melon': 7200, Cassava: 10500, Banana: 6800 };
      document.body.classList.toggle('mobile-entry', new URLSearchParams(window.location.search).has('mobile'));
      const root = document.getElementById('root');
      const peso = (value) => `₱${Number(value || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
      const marketById = (id) => state.markets.find((market) => market.id === Number(id));
      const activeMarkets = () => state.markets.filter((market) => market.active);
      const priceRows = () => state.prices.filter((row) => { const market = marketById(row.marketId); return market && market.active && (state.crop === 'All crops' || row.crop === state.crop) && (state.district === 'All communities' || market.community === state.district); });
      const averagePrice = (crop) => { const rows = state.prices.filter((row) => row.crop === crop && marketById(row.marketId)?.active); return rows.length ? rows.reduce((sum, row) => sum + row.price, 0) / rows.length : 0; };
      function calculatorResult() { const input = state.calculator; const area = Math.max(0, Number(input.area) || 0); const loss = Math.min(100, Math.max(0, Number(input.loss) || 0)); const expectedHarvest = Math.max(0, Number(input.harvest) || 0); const sellableHarvest = expectedHarvest * (1 - loss / 100); const production = Math.max(0, Number(input.production) || 0); const transportation = Math.max(0, Number(input.transportation) || 0); const totalCost = production + transportation; const breakEven = sellableHarvest ? totalCost / sellableHarvest : 0; const margin = Math.max(0, Number(input.margin) || 0); const target = breakEven * (1 + margin / 100); const average = averagePrice(input.crop); const totalValue = average * sellableHarvest; return { area, loss, expectedHarvest, sellableHarvest, production, transportation, totalCost, breakEven, margin, target, average, totalValue, profit: average - breakEven, revenue: target * sellableHarvest }; }
      function notify(message) { state.toast = message; render(); window.setTimeout(() => { state.toast = ''; render(); }, 2600); }
      function go(tab) { window.location.hash = tab; }
      function nav() { return [['overview', 'Overview', '⌂'], ['markets', 'Markets & Trends', '▦'], ['calculator', 'Calculator', '₱'], ['profile', 'Profile / Admin', '○']]; }
      function trendSlideCrop() { const options = crops.slice(1); return state.crop === 'All crops' ? options[((state.priceSlide % options.length) + options.length) % options.length] : state.crop; }
      function trendSeries(crop) { const base = cropTrend[crop]; if (state.period === 'Last 8 months') return { labels: months, values: base }; if (state.period === 'Last 12 months') { const step = base[1] - base[0]; return { labels: ['Oct', 'Nov', 'Dec', 'Jan', ...months], values: [base[0] - step * 4, base[0] - step * 3, base[0] - step * 2, base[0] - step, ...base] }; } return { labels: ['Jan', ...months], values: [base[0] - (base[1] - base[0]), ...base] }; }
      function chartMarkup() { const selected = state.crop === 'All crops' ? crops.slice(1) : [state.crop]; const values = months.map((_, index) => Math.round(selected.reduce((sum, crop) => sum + cropTrend[crop][index], 0) / selected.length)); return lineChartMarkup(months, values); }
      function lineChartMarkup(labels, values) { const min = Math.min(...values); const max = Math.max(...values); const points = values.map((value, index) => `${(index / (values.length - 1)) * 100},${86 - ((value - min) / (max - min || 1)) * 68}`).join(' '); return `<div class="line-chart"><div class="line-chart-y"><span>${peso(max)}</span><span>${peso(Math.round((max + min) / 2))}</span><span>${peso(min)}</span></div><div class="line-chart-area"><div class="line-chart-grid"><i></i><i></i><i></i></div><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Monthly crop price line chart"><polyline points="${points}" fill="none" stroke="#317a5b" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>${values.map((value, index) => `<circle cx="${(index / (values.length - 1)) * 100}" cy="${86 - ((value - min) / (max - min || 1)) * 68}" r="1.7" fill="#f7f8f3" stroke="#317a5b" stroke-width="1.1" vector-effect="non-scaling-stroke"></circle>`).join('')}</svg><div class="line-chart-x">${labels.map((month) => `<span>${month}</span>`).join('')}</div></div></div>`; }
      function priceSlide() { const crop = crops.slice(1)[((state.priceSlide % (crops.length - 1)) + crops.length - 1) % (crops.length - 1)]; return { crop, average: averagePrice(crop), rows: state.prices.filter((row) => row.crop === crop && marketById(row.marketId)?.active) }; }
      function communitySlide() { const options = crops.slice(1); const crop = state.crop === 'All crops' ? options[((state.communitySlide % options.length) + options.length) % options.length] : state.crop; const rows = activeMarkets().filter((market) => state.district === 'All communities' || market.community === state.district).map((market) => ({ market, row: state.prices.find((price) => price.marketId === market.id && price.crop === crop) })); const values = rows.filter((item) => item.row).map((item) => item.row.price); return { crop, rows, low: values.length ? Math.min(...values) : 0, high: values.length ? Math.max(...values) : 0 }; }
      function overviewView() { const slide = priceSlide(); const marketSlide = communitySlide(); const active = activeMarkets(); const totalVolume = state.transactions.reduce((sum, item) => sum + Number(item.quantity.replace(/[^0-9.]/g, '')), 0); return `<section class="page-heading"><div><p class="eyebrow">Porac, Pampanga | 22 September 2026</p><h1>Good morning, Administrator.</h1><p class="subheading">A practical view of crop prices and farm transactions in the Porac area.</p></div><button class="export-button" data-action="export"><span>↓</span> Export snapshot</button></section><section class="overview-grid"><article class="kpi-card accent"><div class="card-top"><span>Average crop price</span><span class="trend-pill up">Auto-updating</span></div><strong>${peso(slide.average)}<span class="unit">/ kg</span></strong><small>${slide.crop} across ${slide.rows.length} offering markets</small><div class="auto-slide-label">Rotating crop prices</div></article><article class="kpi-card"><div class="card-top"><span>Total transactions</span><span class="trend-pill up">Local records</span></div><strong>${state.transactions.length}</strong><small>${totalVolume.toLocaleString()} kg recorded in sample history</small><div class="volume-line"></div></article><article class="kpi-card"><div class="card-top"><span>Registered markets</span><span class="trend-pill neutral">Porac</span></div><strong>${active.length}</strong><small>${state.markets.length} total records, including inactive</small><div class="market-dots">${active.map(() => '<i></i>').join('')}</div></article><article class="kpi-card alert-card"><div class="card-top"><span>Administrator profile</span><span class="alert-dot"></span></div><strong>DA</strong><small>Porac crop pricing coordinator</small><button class="text-button" data-action="profile">Manage local markets <span>→</span></button></article></section><section class="panel weather-panel"><div class="panel-header"><div><span class="section-kicker">Local conditions</span><h2>Porac weather forecast</h2></div><span class="weather-source">Representative local forecast</span></div><div class="weather-summary"><div class="weather-now"><span class="weather-symbol">☀</span><div><strong>31°C</strong><small>Porac, Pampanga · Today</small></div></div><p class="weather-note">Warm conditions with a chance of afternoon rain. Check field access and harvest timing before transport.</p></div><div class="forecast-list">${weatherForecast.map((day) => `<div class="forecast-day"><span>${day.day}</span><strong class="forecast-icon">${day.icon}</strong><strong>${day.temp}</strong><small>${day.note}</small></div>`).join('')}</div></section><section class="dashboard-grid"><article class="panel"><div class="panel-header"><div><span class="section-kicker">Porac price pulse</span><h2>Monthly crop price movement</h2></div><button class="link-button" data-action="markets">Open details →</button></div><div class="chart-meta"><strong>${peso(cropTrend.Rice[cropTrend.Rice.length - 1])} / kg</strong><span class="green-text">Representative September prices</span></div>${chartMarkup()}<div class="chart-note"><span class="note-badge">i</span> The line shows the average movement across the selected crop set by month.</div></article><article class="panel comparison-panel"><div class="panel-header"><div><span class="section-kicker">Same-crop comparison</span><h2>${marketSlide.crop} local market status</h2></div><span class="comparison-slide-badge">Auto ${state.communitySlide % (crops.length - 1) + 1} / ${crops.length - 1}</span></div><div class="slide-main"><div><strong>${peso(marketSlide.low)} - ${peso(marketSlide.high)} / kg</strong><p>${marketSlide.rows.filter((item) => item.row).length} of ${marketSlide.rows.length} markets offer ${marketSlide.crop}. Difference between highest and lowest: ${peso(marketSlide.high - marketSlide.low)} / kg.</p></div></div><div class="comparison-list">${marketSlide.rows.map((item) => `<div class="comparison-row ${item.row ? '' : 'unavailable-row'}"><div class="row-label"><strong>${esc(item.market.community)}</strong><span>${item.row ? peso(item.row.price) : 'Not offered'}</span></div><div class="bar-track"><div class="bar-fill ${item.row ? 'highlight' : ''}" style="width:${item.row ? Math.max(14, item.row.price / Math.max(marketSlide.high, 1) * 100) : 0}%"></div></div><small>${item.row ? 'Available' : 'No listing'}</small></div>`).join('')}</div><div class="auto-slide-label">Rotating same-crop market comparison</div></article></section>`; }
      function marketView() { const rows = priceRows(); const slide = communitySlide(); const trendCrop = trendSlideCrop(); const trend = trendSeries(trendCrop); const visibleTransactions = state.showAllTransactions ? state.transactions : state.transactions.slice(0, 4); const allCrops = crops.slice(1); return `<section class="page-heading"><div><p class="eyebrow">Porac local market network</p><h1>Markets & Trends</h1><p class="subheading">Compare farmer prices, crop availability, and recorded transactions across communities.</p></div><button class="export-button" data-action="export"><span>↓</span> Export market view</button></section><section class="filter-bar"><div class="filter-title"><span class="filter-icon">≡</span> Filter local view</div><label>Crop<select id="crop-select">${crops.map((item) => `<option ${item === state.crop ? 'selected' : ''}>${item}</option>`).join('')}</select></label><label>Community<select id="district-select">${districts.map((item) => `<option ${item === state.district ? 'selected' : ''}>${item}</option>`).join('')}</select></label><label>Period<select id="period-select">${['Last 8 months', 'Last 12 months', 'This year'].map((item) => `<option ${item === state.period ? 'selected' : ''}>${item}</option>`).join('')}</select></label><button class="clear-button" data-action="clear">Clear</button></section><section class="dashboard-grid"><article class="panel trend-panel"><div class="panel-header"><div><span class="section-kicker">Price trend</span><h2>${esc(trendCrop)} movement</h2></div><span class="calculator-status">Auto ${state.priceSlide % (crops.length - 1) + 1} / ${crops.length - 1}</span></div>${lineChartMarkup(trend.labels, trend.values)}<div class="auto-slide-label">Rotating crop trend</div></article><article class="panel slide-panel"><div class="panel-header"><div><span class="section-kicker">By community</span><h2>${slide.crop} price difference</h2></div><span class="comparison-slide-badge">Auto ${state.communitySlide % allCrops.length + 1} / ${allCrops.length}</span></div><div class="slide-main"><div><strong>${peso(slide.low)} - ${peso(slide.high)} / kg</strong><p>${slide.rows.filter((item) => item.row).length} of ${slide.rows.length} markets offer ${slide.crop}. Highest difference: ${peso(slide.high - slide.low)} / kg.</p></div></div><div class="comparison-list">${slide.rows.map((item) => `<div class="comparison-row ${item.row ? '' : 'unavailable-row'}"><div class="row-label"><strong>${esc(item.market.community)}</strong><span>${item.row ? peso(item.row.price) : 'Not offered'}</span></div><div class="bar-track"><div class="bar-fill ${item.row ? 'highlight' : ''}" style="width:${item.row ? Math.max(14, item.row.price / Math.max(slide.high, 1) * 100) : 0}%"></div></div><small>${item.row ? 'Available' : 'No listing'}</small></div>`).join('')}</div><div class="auto-slide-label">Rotating price difference</div></article></section><section class="panel market-panel"><div class="panel-header"><div><span class="section-kicker">Current listings</span><h2>Crop prices by local market</h2></div><span class="muted-label">${rows.length} listings</span></div><div class="table-wrap"><table><thead><tr><th>Market</th><th>Crop</th><th>Community</th><th>Price / kg</th><th>Change</th><th>Volume</th><th>Status</th></tr></thead><tbody>${rows.map((row) => { const market = marketById(row.marketId); return `<tr><td><strong>${esc(market.name)}</strong></td><td>${row.crop}</td><td><span class="region-label"><i></i>${esc(market.community)}</span></td><td><strong>${peso(row.price)}</strong></td><td class="${row.change >= 0 ? 'green-text' : 'red-text'}">${row.change >= 0 ? '+' : ''}${row.change}%</td><td>${row.volume}</td><td><span class="status ${row.change < 0 ? 'watch' : 'stable'}"><i></i>${row.change < 0 ? 'Review' : 'Recorded'}</span></td></tr>`; }).join('')}</tbody></table>${!rows.length ? '<div class="empty-state">No active local listings match these filters.</div>' : ''}</div></section><section class="panel market-panel"><div class="panel-header"><div><span class="section-kicker">Past transactions</span><h2>Recent farmer records</h2></div><button class="link-button" data-action="toggle-transactions">${state.showAllTransactions ? 'Show fewer' : 'View all'} →</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Crop</th><th>Market</th><th>Quantity</th><th>Price / kg</th><th>Status</th></tr></thead><tbody>${visibleTransactions.map((item) => `<tr><td>${item.date}</td><td><strong>${item.crop}</strong></td><td>${esc(marketById(item.marketId)?.name || 'Removed market')}</td><td>${item.quantity}</td><td>${peso(item.price)}</td><td><span class="status stable"><i></i>${item.status}</span></td></tr>`).join('')}</tbody></table></div></section><section class="panel market-panel"><div class="comparison-header"><div><span class="section-kicker">Overall comparison</span><h2>Crop availability by market</h2></div><span class="muted-label">Same crops, different local supply</span></div><div class="table-wrap crop-comparison-table"><table><thead><tr><th>Crop</th>${activeMarkets().map((market) => `<th>${esc(market.community)}</th>`).join('')}</tr></thead><tbody>${allCrops.map((crop) => `<tr><td><strong>${crop}</strong><small>Price per kilo</small></td>${activeMarkets().map((market) => { const row = state.prices.find((item) => item.marketId === market.id && item.crop === crop); return row ? `<td><strong>${peso(row.price)}</strong></td>` : '<td class="unavailable">Not offered</td>'; }).join('')}</tr>`).join('')}</tbody></table></div></section>`; }
        function legacyMarketView() { const rows = priceRows(); const slide = communitySlide(); const visibleTransactions = state.showAllTransactions ? state.transactions : state.transactions.slice(0, 4); const allCrops = crops.slice(1); return `<section class="page-heading"><div><p class="eyebrow">Porac local market network</p><h1>Markets & Trends</h1><p class="subheading">Compare farmer prices, crop availability, and recorded transactions across communities.</p></div><button class="export-button" data-action="export"><span>↓</span> Export market view</button></section><section class="filter-bar"><div class="filter-title"><span class="filter-icon">≡</span> Filter local view</div><label>Crop<select id="crop-select">${crops.map((item) => `<option ${item === state.crop ? 'selected' : ''}>${item}</option>`).join('')}</select></label><label>Community<select id="district-select">${districts.map((item) => `<option ${item === state.district ? 'selected' : ''}>${item}</option>`).join('')}</select></label><label>Period<select id="period-select"><option>Last 8 months</option><option>Last 12 months</option><option>This year</option></select></label><button class="clear-button" data-action="clear">Clear</button></section><section class="dashboard-grid"><article class="panel trend-panel"><div class="panel-header"><div><span class="section-kicker">Price trend</span><h2>${esc(state.crop)} movement</h2></div><span class="calculator-status">₱ / kg</span></div>${chartMarkup()}<div class="chart-note"><span class="note-badge">i</span> Representative monthly farmgate averages for the Porac prototype.</div></article><article class="panel slide-panel"><div class="panel-header"><div><span class="section-kicker">By community</span><h2>${slide.crop} price difference</h2></div><span class="comparison-slide-badge">${state.communitySlide % allCrops.length + 1} / ${allCrops.length}</span></div><div class="slide-main"><button class="slide-arrow" data-action="community-prev">←</button><div><strong>${peso(slide.low)} - ${peso(slide.high)} / kg</strong><p>${slide.rows.filter((item) => item.row).length} of ${slide.rows.length} markets offer ${slide.crop}. Highest difference: ${peso(slide.high - slide.low)} / kg.</p></div><button class="slide-arrow" data-action="community-next">→</button></div><div class="comparison-list">${slide.rows.map((item) => `<div class="comparison-row ${item.row ? '' : 'unavailable-row'}"><div class="row-label"><strong>${esc(item.market.community)}</strong><span>${item.row ? peso(item.row.price) : 'Not offered'}</span></div><div class="bar-track"><div class="bar-fill ${item.row ? 'highlight' : ''}" style="width:${item.row ? Math.max(14, item.row.price / Math.max(slide.high, 1) * 100) : 0}%"></div></div><small>${item.row ? 'Available' : 'No listing'}</small></div>`).join('')}</div></article></section><section class="panel market-panel"><div class="panel-header"><div><span class="section-kicker">Current listings</span><h2>Crop prices by local market</h2></div><span class="muted-label">${rows.length} listings</span></div><div class="table-wrap"><table><thead><tr><th>Market</th><th>Crop</th><th>Community</th><th>Price / kg</th><th>Change</th><th>Volume</th><th>Status</th></tr></thead><tbody>${rows.map((row) => { const market = marketById(row.marketId); return `<tr><td><strong>${esc(market.name)}</strong></td><td>${row.crop}</td><td><span class="region-label"><i></i>${esc(market.community)}</span></td><td><strong>${peso(row.price)}</strong></td><td class="${row.change >= 0 ? 'green-text' : 'red-text'}">${row.change >= 0 ? '+' : ''}${row.change}%</td><td>${row.volume}</td><td><span class="status ${row.change < 0 ? 'watch' : 'stable'}"><i></i>${row.change < 0 ? 'Review' : 'Recorded'}</span></td></tr>`; }).join('')}</tbody></table>${!rows.length ? '<div class="empty-state">No active local listings match these filters.</div>' : ''}</div></section><section class="panel market-panel"><div class="panel-header"><div><span class="section-kicker">Past transactions</span><h2>Recent farmer records</h2></div><button class="link-button" data-action="toggle-transactions">${state.showAllTransactions ? 'Show fewer' : 'View all'} →</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Crop</th><th>Market</th><th>Quantity</th><th>Price / kg</th><th>Status</th></tr></thead><tbody>${visibleTransactions.map((item) => `<tr><td>${item.date}</td><td><strong>${item.crop}</strong></td><td>${esc(marketById(item.marketId)?.name || 'Removed market')}</td><td>${item.quantity}</td><td>${peso(item.price)}</td><td><span class="status stable"><i></i>${item.status}</span></td></tr>`).join('')}</tbody></table></div></section><section class="panel market-panel"><div class="comparison-header"><div><span class="section-kicker">Overall comparison</span><h2>Crop availability by market</h2></div><span class="muted-label">Same crops, different local supply</span></div><div class="table-wrap crop-comparison-table"><table><thead><tr><th>Crop</th>${activeMarkets().map((market) => `<th>${esc(market.community)}</th>`).join('')}</tr></thead><tbody>${allCrops.map((crop) => `<tr><td><strong>${crop}</strong><small>Price per kilo</small></td>${activeMarkets().map((market) => { const row = state.prices.find((item) => item.marketId === market.id && item.crop === crop); return row ? `<td><strong>${peso(row.price)}</strong></td>` : '<td class="unavailable">Not offered</td>'; }).join('')}</tr>`).join('')}</tbody></table></div></section>`; }
      function calculatorView() { const result = calculatorResult(); const decision = result.sellableHarvest === 0 ? ['negative', 'Enter planted area above zero to calculate a break-even price.'] : ['', `Recommended target price for ${state.calculator.crop} is ${peso(result.target)} per kilo.`]; const fields = [['crop', 'Crop'], ['area', 'Total area planted (hectares)'], ['harvest', 'Total harvest volume (kg)'], ['production', 'Production costs (₱)'], ['transportation', 'Transportation costs (₱)'], ['margin', 'Target margin (%)'], ['loss', 'Expected loss (%)']]; return `<section class="page-heading"><div><p class="eyebrow">Cost-based pricing model</p><h1>Farmer calculator</h1><p class="subheading">Estimate a crop price from planted area, total costs, target margin, and expected loss.</p></div><span class="calculator-status">Automatic target price</span></section><section class="panel calculator-panel"><div class="panel-header"><div><span class="section-kicker">Editable assumptions</span><h2>Pricing inputs</h2></div><span class="muted-label">All costs in Philippine pesos</span></div><div class="calculator-grid"><div class="calculator-form">${fields.map(([key, label]) => `<label>${label}${key === 'crop' ? `<select data-calc="crop">${crops.slice(1).map((item) => `<option ${item === state.calculator.crop ? 'selected' : ''}>${item}</option>`).join('')}</select>` : `<input data-calc="${key}" type="text" inputmode="decimal" min="0" step="${key === 'area' ? '0.1' : key === 'margin' || key === 'loss' ? '0.5' : '100'}" value="${state.calculator[key]}" />`}</label>`).join('')}</div><div class="calculator-results"><div class="result-box"><span>Average price of crop</span><strong>${peso(result.average)} / kg</strong></div><div class="result-box"><span>Target price per kilo</span><strong>${peso(result.target)}</strong></div><div class="result-box"><span>Total value of input data</span><strong>${peso(result.totalValue)}</strong></div><div class="calculation-breakdown"><div class="breakdown-heading">Breakdown</div><div class="breakdown-row"><span>Expected loss</span><strong>${result.loss}%</strong></div><div class="breakdown-row"><span>Harvest volume</span><strong>${result.sellableHarvest.toLocaleString()} kg</strong></div><div class="breakdown-row"><span>Average price per kilo</span><strong>${peso(result.average)}</strong></div><div class="breakdown-row"><span>Target price per kilo</span><strong>${peso(result.target)}</strong></div><div class="breakdown-row"><span>Profit per kilo</span><strong>${peso(result.profit)}</strong></div><div class="breakdown-row"><span>Break-even</span><strong>${peso(result.breakEven)}</strong></div><div class="breakdown-row total"><span>Cost-based</span><strong>${peso(result.totalCost)}</strong></div></div><div class="decision-box ${decision[0]}">${decision[1]}</div></div></div></section>`; }
      function profileView() { return `<section class="page-heading"><div><p class="eyebrow">Operations control</p><h1>Profile / Admin</h1><p class="subheading">Manage the registered Porac market network and keep the local crop database current.</p></div><span class="calculator-status">Administrator access</span></section><section class="panel profile-panel"><div class="profile-overview"><div class="profile-avatar">DA</div><div class="profile-details"><strong>Department of Agriculture Coordinator</strong><span>Porac Crop Pricing DSS administrator</span><small>Overseeing local market records and farmer pricing information</small></div><span class="calculator-status">Active</span></div><div class="admin-summary"><span><strong>${activeMarkets().length}</strong> active markets</span><span><strong>${state.markets.length}</strong> registered records</span><span><strong>${new Set(state.prices.map((row) => row.crop)).size}</strong> crop types tracked</span></div><div class="panel-header"><div><span class="section-kicker">Market registry</span><h2>Registered local markets</h2></div><span class="muted-label">Prototype data stored in this browser session</span></div><div class="table-wrap admin-market-table"><table><thead><tr><th>Market</th><th>Community</th><th>Crops offered</th><th>Contact / location</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.markets.map((market) => `<tr><td><strong>${esc(market.name)}</strong></td><td>${esc(market.community)}</td><td>${market.crops.join(', ')}</td><td>${esc(market.contact)}</td><td><button class="status-toggle ${market.active ? 'active' : ''}" data-market-toggle="${market.id}">${market.active ? 'Active' : 'Inactive'}</button></td><td><button class="table-action" data-market-delete="${market.id}">Remove</button></td></tr>`).join('')}</tbody></table></div><div class="market-admin-section"><div class="section-kicker">Add a local market</div><form id="market-form" class="profile-grid"><label>Market name<input name="name" required placeholder="Example: Sapang Uwak Growers" /></label><label>Community<select name="community">${districts.slice(1).map((item) => `<option>${item}</option>`).join('')}</select></label><label>Crops offered<select name="crops" multiple size="4">${crops.slice(1).map((item) => `<option>${item}</option>`).join('')}</select></label><label>Contact / location<input name="contact" required placeholder="Collection point or contact" /></label><div class="profile-actions"><button class="export-button" type="submit">Add market</button><span class="profile-status">New records are available immediately in comparisons.</span></div></form></div></section>`; }
      function render() { const previousScrollTop = document.querySelector('.main-content')?.scrollTop || 0; const views = { overview: overviewView, markets: marketView, calculator: calculatorView, profile: profileView }; if (!views[state.tab]) state.tab = 'overview'; root.innerHTML = `<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">P</span><span>Porac Pricing DSS</span></div><div class="sidebar-label">Porac decision support</div><nav>${nav().map(([id, label, icon]) => `<a class="nav-item ${state.tab === id ? 'active' : ''}" href="#${id}" aria-label="${label}" title="${label}"><span class="nav-icon">${icon}</span>${label}</a>`).join('')}</nav><div class="sidebar-footer"><div class="avatar">DA</div><div><strong>DA Porac</strong><small>Administrator workspace</small></div><span class="more">...</span></div></aside><main class="main-content"><header class="topbar"><div class="breadcrumb">DSS / <strong>Porac crop pricing</strong></div><div class="top-actions"><span class="live-dot"></span> Local sample data <button class="icon-button" data-action="notify" aria-label="Notifications">!</button><button class="icon-button" data-action="profile" aria-label="Profile">○</button></div></header><div class="filter-context">All sample prices are in Philippine pesos per kilogram and represent local Porac market conditions.</div>${views[state.tab]()}<footer>Local prototype data refreshes when records are updated <span>Porac, Pampanga | Last updated 22 Sep 2026</span></footer></main></div>${state.toast ? `<div class="app-toast visible">${esc(state.toast)}</div>` : ''}`; bind(); const mainContent = document.querySelector('.main-content'); if (mainContent) mainContent.scrollTop = previousScrollTop; }
      function reorderMarketPanels() { const panels = [...document.querySelectorAll('.market-panel')]; const current = panels.find((panel) => panel.textContent.includes('Current listings')); const past = panels.find((panel) => panel.textContent.includes('Past transactions')); const overall = panels.find((panel) => panel.textContent.includes('Overall comparison')); if (current && past && overall) { current.parentElement.insertBefore(overall, current); current.parentElement.insertBefore(current, past); } }
      function simplifyCurrentListings() { const panel = [...document.querySelectorAll('.market-panel')].find((item) => item.textContent.includes('Current listings')); const table = panel?.querySelector('table'); if (!table) return; const groups = new Map(); [...table.tBodies[0].rows].forEach((row) => { const market = row.cells[0].textContent.trim(); const community = row.cells[2].textContent.trim(); const crop = row.cells[1].textContent.trim(); const volume = Number(row.cells[5].textContent.replace(/[^0-9.]/g, '')) || 0; const key = `${market}|${community}`; if (!groups.has(key)) groups.set(key, { market, community, offerings: [], volume: 0 }); const group = groups.get(key); group.offerings.push(crop); group.volume += volume; }); table.tHead.innerHTML = '<tr><th>Market</th><th>Community</th><th>Crop offerings</th><th>Total volume</th></tr>'; table.tBodies[0].innerHTML = [...groups.values()].map((group) => `<tr><td><strong>${esc(group.market)}</strong></td><td>${esc(group.community)}</td><td>${esc(group.offerings.join(', '))}</td><td>${group.volume.toLocaleString()} kg</td></tr>`).join(''); }
      function bind() { reorderMarketPanels(); simplifyCurrentListings(); document.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', () => { const action = button.dataset.action; if (action === 'clear') { state.crop = 'All crops'; state.district = 'All communities'; state.period = 'Last 8 months'; render(); } else if (action === 'toggle-transactions') { state.showAllTransactions = !state.showAllTransactions; render(); } else if (action === 'profile' || action === 'markets') go(action === 'profile' ? 'profile' : 'markets'); else if (action === 'notify') notify('No new administrator alerts.'); else if (action === 'export') notify('Snapshot prepared locally. Connect a printer or save this page to export.'); })); document.getElementById('crop-select')?.addEventListener('change', (event) => { state.crop = event.target.value; render(); }); document.getElementById('district-select')?.addEventListener('change', (event) => { state.district = event.target.value; render(); }); document.getElementById('period-select')?.addEventListener('change', (event) => { state.period = event.target.value; render(); }); document.querySelectorAll('[data-calc]').forEach((input) => input.addEventListener('input', (event) => { const field = event.target; const key = field.dataset.calc; const selectionStart = field.selectionStart; const selectionEnd = field.selectionEnd; state.calculator[key] = field.value; render(); const restoredInput = document.querySelector(`[data-calc="${key}"]`); if (restoredInput) { restoredInput.focus(); if (typeof selectionStart === 'number' && typeof restoredInput.setSelectionRange === 'function') restoredInput.setSelectionRange(selectionStart, selectionEnd); } })); document.querySelectorAll('[data-market-toggle]').forEach((button) => button.addEventListener('click', () => { const market = marketById(button.dataset.marketToggle); market.active = !market.active; notify(`${market.name} is now ${market.active ? 'active' : 'inactive'}.`); })); document.querySelectorAll('[data-market-delete]').forEach((button) => button.addEventListener('click', () => { const id = Number(button.dataset.marketDelete); const market = marketById(id); state.markets = state.markets.filter((item) => item.id !== id); state.prices = state.prices.filter((item) => item.marketId !== id); notify(`${market.name} was removed from the registry.`); })); document.getElementById('market-form')?.addEventListener('submit', (event) => { event.preventDefault(); const form = new FormData(event.target); const selected = [...event.target.elements.crops.selectedOptions].map((option) => option.value); if (!selected.length) { notify('Select at least one crop for the new market.'); return; } const id = Math.max(0, ...state.markets.map((market) => market.id)) + 1; state.markets.push({ id, name: form.get('name'), community: form.get('community'), crops: selected, contact: form.get('contact'), active: true }); notify(`${form.get('name')} was added to the registry.`); }); }
      window.addEventListener('hashchange', () => { state.tab = window.location.hash.replace('#', '') || 'overview'; render(); }); window.setInterval(() => { const filtersActive = state.crop !== 'All crops' || state.district !== 'All communities'; if ((state.tab === 'overview' || state.tab === 'markets') && !filtersActive) { state.priceSlide += 1; state.communitySlide += 1; render(); } }, 7000); render();
    </script>
  </body>
